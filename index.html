<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind Test</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
  <section>
    <div
      class="relative flex h-[50vh] w-full items-center justify-center bg-[url('/images/background.png')] bg-cover bg-center bg-no-repeat">
      <img class="absolute top-5 left-3 h-auto w-[180px]" src="/images/ultimatixLogo.png" alt="Ultimatix Logo">
      <img class="h-[468px] w-[600px] rounded-b-[190px]" src="/images/animationBoat.gif" alt="Animated Boat">
    </div>
  </section>
  <section class = "pt-[50px]">
    <div class = "flex flex-col gap-y-2 items-center m-10">
      <div class = "text-[36px] font-bold font-sans text-[#003963]">Sorry, Application is temporarily under maintenance</div>
      <div class = "text-[20px] font-bold font-sans text-[#003963]">We regret the inconvenience caused</div>
      <div class = "text-[20px] font-bold font-sans text-[#003963]">It will be available at</div>
      <div class = "text-[20px] font-bold font-sans text-[#d61717]">Mon, 23 Nov 2026, 05:00 IST
        Show Time in GMT</div>
      <button class = "bg-[#4B4BC7] w-[150px] h-[32px] text-[#fff] font-semibold rounded-[4px] border-[#4B4BC7]">Show time in IST</button>
    </div>
  </section>
  <footer>
    <div class = "pl-7 text-[16px] leading-[14px] text-[#707070]">Copyright © 2026 Tata Consultancy Services</div>
  </footer>
</body>

</html>
